# Render.com Blueprint — Eldorado Telegram botu
#
# Ücretsiz plan: 15 dk gelen istek olmazsa uykuya geçer. Bot, RENDER_EXTERNAL_URL
# varsa kendi /health ucunu 5 dk'da bir yoklar (birincil). .github/workflows/
# keepalive.yml aynı işi dışarıdan yapar (yedek; GitHub 60+ gün hareketsizlikte
# zamanlanmış işleri kapatabilir).
# Kalıcı disk yok: yeniden başlatmada data/state.json sıfırlanır, bot mevcut
# siparişleri "görülmüş" sayıp devam eder (bildirim yağmuru olmaz).
services:
  - type: web
    name: eldorado-telegram-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node -v
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: POLL_SECONDS
        value: "20"
      # Gizli değerler: Render panelinde siz girersiniz (sync: false).
      - key: ELDORADO_CLIENT_ID
        sync: false
      - key: ELDORADO_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Kalıcı disk olmadığı için chat id ortam değişkeninde dursun.
      - key: TELEGRAM_CHAT_ID
        sync: false
